name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies: the suite runs on node:test, and the module itself
      # ships as plain ES modules that Foundry loads directly.
      - name: Run tests
        run: npm test

      - name: Check every module script parses
        run: for f in scripts/*.js; do node --check "$f" || exit 1; done

      - name: Check module.json is valid JSON
        run: node -e "JSON.parse(require('fs').readFileSync('module.json','utf8'))"
