name: Release

# Publishes the artifacts module.json already points at: pushing a v* tag
# produces the zip Foundry downloads and the manifest it reads to find it.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        run: npm test

      - name: Resolve version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Check the tag matches the manifest version
        run: |
          manifest=$(node -p "require('./module.json').version")
          if [ "$manifest" != "${{ steps.version.outputs.value }}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match module.json version $manifest" >&2
            exit 1
          fi

      # `manifest` stays on the latest URL so Foundry can detect updates;
      # `download` is pinned to this tag so an install gets these exact files.
      - name: Pin the download URL to this release
        run: |
          node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("module.json", "utf8"));
            const repo = process.env.GITHUB_REPOSITORY;
            const tag = process.env.GITHUB_REF_NAME;
            m.manifest = `https://github.com/${repo}/releases/latest/download/module.json`;
            m.download = `https://github.com/${repo}/releases/download/${tag}/echo-codex-notes.zip`;
            fs.writeFileSync("module.json", JSON.stringify(m, null, 2) + "\n");
          '

      - name: Build the module zip
        run: zip -r echo-codex-notes.zip module.json scripts styles templates README.md

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.value }}
          files: |
            module.json
            echo-codex-notes.zip
          generate_release_notes: true
